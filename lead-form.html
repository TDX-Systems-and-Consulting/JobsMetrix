<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a Free Estimate</title>
<style>
  :root { --bg:#f6f4ef; --card:#ffffff; --ink:#1c1b19; --muted:#6b6760; --accent:#d97706; --line:#e4dfd5; --ok:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#121b2e; --ink:#eef2f8; --muted:#9aa6bb; --line:#24314a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding:16px; }
  .card { max-width:520px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  p.sub { margin:0 0 18px; color:var(--muted); font-size:.92rem; }
  label { display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin:12px 0 4px; }
  input, select, textarea { width:100%; font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:9px; padding:10px 12px; }
  textarea { min-height:90px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:440px) { .row { grid-template-columns:1fr; } }
  button { margin-top:18px; width:100%; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:13px; font:inherit; font-weight:700; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:default; }
  .hp { position:absolute; left:-5000px; }
  .msg { margin-top:14px; font-size:.92rem; }
  .ok { color:var(--ok); font-weight:600; }
  .err { color:#b91c1c; }
</style>
</head>
<body>
<div class="card" id="card">
  <h1>Request a free estimate</h1>
  <p class="sub">Tell us about your project and we'll reach out within one business day.</p>
  <form id="f" novalidate>
    <label for="name">Name *</label>
    <input id="name" name="name" autocomplete="name" required>
    <div class="row">
      <div><label for="phone">Phone *</label><input id="phone" name="phone" type="tel" autocomplete="tel" required></div>
      <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"></div>
    </div>
    <label for="address">Property address</label>
    <input id="address" name="address" autocomplete="street-address">
    <label for="type">I am a…</label>
    <select id="type" name="type">
      <option value="Retail homeowner">Homeowner</option>
      <option value="Investor flip">Investor / flipper</option>
      <option value="Rental / landlord">Landlord / rental owner</option>
      <option value="Commercial">Business / commercial</option>
      <option value="Other">Other</option>
    </select>
    <label for="message">What do you need done?</label>
    <textarea id="message" name="message" placeholder="Kitchen remodel, flooring, full rehab, punch list…"></textarea>
    <label for="heard">How did you hear about us?</label>
    <select id="heard" name="heard">
      <option value="Website">Website / search</option>
      <option value="Referral">Friend or referral</option>
      <option value="Facebook">Facebook</option>
      <option value="Nextdoor">Nextdoor</option>
      <option value="Yard sign">Yard sign</option>
      <option value="Truck">Saw our truck</option>
      <option value="Other">Other</option>
    </select>
    <input class="hp" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button id="go" type="submit">Request my estimate</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>
</div>
<script>
  const ENDPOINT = 'https://us-central1-kytrac-72d91.cloudfunctions.net/kytleadCapture';
  const company = new URLSearchParams(location.search).get('c') || '';
  const f = document.getElementById('f'), go = document.getElementById('go'), msg = document.getElementById('msg');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const v = id => document.getElementById(id).value.trim();
    if (!v('name') || !v('phone')) { msg.className = 'msg err'; msg.textContent = 'Please add your name and phone number.'; return; }
    if (!company) { msg.className = 'msg err'; msg.textContent = 'This form link is missing its company code.'; return; }
    go.disabled = true; go.textContent = 'Sending…'; msg.textContent = '';
    try {
      const r = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ c: company, name: v('name'), phone: v('phone'), email: v('email'), address: v('address'),
          type: v('type'), message: v('message'), heard: v('heard'), website: v('website'), page: document.referrer || location.href }) });
      if (!r.ok) throw new Error('status ' + r.status);
      document.getElementById('card').innerHTML = '<h1>Thank you!</h1><p class="sub">We got your request and will reach out within one business day.</p>';
    } catch (err) {
      go.disabled = false; go.textContent = 'Request my estimate';
      msg.className = 'msg err'; msg.textContent = 'Something went wrong sending that. Please try again, or call us.';
    }
  });
</script>
</body>
</html>
