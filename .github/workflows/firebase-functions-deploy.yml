# Auto-deploys JOBSMETRIX Cloud Functions to Firebase on every push to
# main that touches functions/** -- same goal as the Hosting workflow:
# a push IS the deploy, no local Firebase CLI needed from Travis's
# machine. Uses the same service account secret already configured for
# Hosting (FIREBASE_SERVICE_ACCOUNT_KYTRAC_72D91).
name: Deploy Cloud Functions to Firebase on push to main

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Write runtime environment variables
        working-directory: functions
        run: |
          echo "SENDGRID_KEY=${{ secrets.SENDGRID_API_KEY }}" >> .env
          echo "QBO_TOKEN_ENCRYPTION_KEY=${{ secrets.QBO_TOKEN_ENCRYPTION_KEY }}" >> .env
        # Written fresh from GitHub secrets on every deploy -- never
        # committed to the repo (functions/.env is gitignored). Both
        # env vars are checked first in code (process.env.SENDGRID_KEY,
        # process.env.QBO_TOKEN_ENCRYPTION_KEY), falling back to the
        # legacy functions.config() only if unset.

      - name: Deploy to Firebase Functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --project kytrac-72d91
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KYTRAC_72D91 }}
